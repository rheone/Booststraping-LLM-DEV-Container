schema_version: "1.1"
name: migrate-layered-orders
expected_outcome: |
  The three order use cases (get, create, ship) live in slices under src/Legacy/Features/Orders/, with the
  same routes, JSON shapes, status codes, and {"error": "..."} bodies as before. Because the project targets
  net10.0 (C# 14), outcomes use a closed record hierarchy fallback, not a C# 15 union. Behavior is pinned by
  tests written before the move and passing after it. The OrderService and generic repository are removed
  once unused. No packages are added to the app project. The final message lists the decisions taken.
context:
  scaffold_script: place-files.sh
